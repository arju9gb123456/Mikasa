<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mikasa</title>
<style>
  :root {
    --bg: #07070a;
    --panel: rgba(18, 14, 18, 0.82);
    --line: rgba(255, 70, 70, 0.16);
    --text: #f1e9ea;
    --dim: #9a8e91;
    --red: #ff3b3b;
    --red2: #c4161c;
    --pink: #ff5fa2;
    --green: #39e58c;
    --amber: #ffb547;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .app { display: grid; height: 100vh; grid-template-rows: 38px 1fr 54px;
    grid-template-columns: 260px 1fr 310px; grid-template-areas: "top top top" "left center right" "bottom bottom bottom"; }

  /* top bar */
  .top { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 0 16px;
    border-bottom: 1px solid var(--line); background: #0b080a; letter-spacing: .08em; }
  .top b { color: var(--red); }
  .top .sub { color: var(--dim); font-size: 11px; }
  .top .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .top .right { margin-left: auto; color: var(--dim); font-size: 11px; }

  /* panels */
  .panel { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 16px; overflow: hidden; }
  .left { grid-area: left; }
  .right { grid-area: right; border-right: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
  h3 { margin: 0 0 10px; font-size: 10.5px; letter-spacing: .18em; color: var(--red); font-weight: 600; }
  .stat { margin-bottom: 12px; }
  .stat .row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); margin-bottom: 4px; }
  .stat .row span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
  .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; border-radius: 4px; transition: width .8s ease;
    background: linear-gradient(90deg, var(--green), var(--amber) 70%, var(--red)); }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; font-size: 11.5px; color: var(--dim); }
  .kv span:nth-child(even) { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  .sep { height: 1px; background: var(--line); margin: 16px 0; }

  /* center: rings */
  .center { grid-area: center; position: relative; display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(circle at 50% 46%, #3a0508 0%, #1a0306 38%, #07070a 72%); }
  .rings { position: relative; width: min(64vh, 92%); aspect-ratio: 1; margin-top: -6vh; }
  .ring { position: absolute; inset: 0; border-radius: 50%; }
  .r1 { inset: 0%;  background: radial-gradient(circle, transparent 66%, rgba(255,40,40,.10) 67%, transparent 71%); }
  .r2 { inset: 9%;  border: 2px solid rgba(255,60,60,.30); }
  .r3 { inset: 17%; border: 1px dashed rgba(255,90,90,.35); animation: spin 40s linear infinite; }
  .r4 { inset: 25%; background: radial-gradient(circle, #c4161c 0%, #8c0d12 55%, #4a060a 100%); opacity: .55; }
  .r5 { inset: 33%; background: radial-gradient(circle, #ff4b4b 0%, #c4161c 65%, #7a0b10 100%);
    box-shadow: 0 0 60px rgba(255,40,40,.55), inset 0 0 40px rgba(0,0,0,.35); }
  .arc { position: absolute; border-radius: 50%; border: 3px solid transparent; }
  .a1 { inset: 4%;  border-top-color: var(--red); border-right-color: rgba(255,59,59,.4); animation: spin 9s linear infinite; }
  .a2 { inset: 13%; border-bottom-color: var(--pink); border-left-color: rgba(255,95,162,.35); animation: spin 14s linear infinite reverse; }
  .a3 { inset: 21%; border-top-color: rgba(255,180,180,.6); animation: spin 6s linear infinite; }
  .core { position: absolute; inset: 41%; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle, #ff5757, #d01a20); box-shadow: 0 0 40px rgba(255,60,60,.8);
    font-weight: 800; letter-spacing: .14em; font-size: clamp(13px, 2.2vh, 20px); color: #fff; transition: transform .12s ease; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  .rings { animation: breathe 5s ease-in-out infinite; }
  body.listening .a1, body.listening .a2 { animation-duration: 3s; }
  body.listening .r2 { border-color: rgba(255,120,120,.75); box-shadow: 0 0 22px rgba(255,60,60,.5); }
  body.thinking .a3 { animation-duration: 1s; border-top-color: #fff; }
  body.thinking .a1 { animation-duration: 2s; }
  body.speaking .rings { animation-duration: 1.2s; }

  .status { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); padding: 6px 14px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(0,0,0,.4); font-size: 12px; letter-spacing: .06em; }
  .status i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 7px; vertical-align: 0; }
  body.listening .status i { background: var(--green); box-shadow: 0 0 8px var(--green); }
  body.thinking .status i { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  body.speaking .status i { background: var(--pink); box-shadow: 0 0 8px var(--pink); }

  /* avatar */
  .avatar { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: min(34vh, 260px); }
  .avatar svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 18px rgba(0,0,0,.6)); }
  .eyes { transform-origin: 50% 50%; transform-box: fill-box; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  .tail { transform-origin: 150px 70px; transform-box: view-box; animation: tailsway 3.4s ease-in-out infinite; }
  @keyframes tailsway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
  .head { transform-origin: 120px 180px; transform-box: view-box; transition: transform .5s ease; }
  .pupils { transition: transform .5s ease; }
  #blush { transition: opacity .6s ease; opacity: .45; }
  .brow { transition: transform .4s ease; }
  #wink { transition: opacity .15s; }
  /* shy (idle): nazar neeche, gaal laal, sir halka sa jhuka */
  body.idle .pupils, body.sleeping .pupils { transform: translateY(2.5px) translateX(-1px); }
  body.idle #blush { opacity: .85; }
  body.idle .head { transform: rotate(-2deg); }
  /* listening: dhyan se, sir tilt, eyebrows upar */
  body.listening .head { transform: rotate(4deg); }
  body.listening .brow { transform: translateY(-2.5px); }
  body.listening #blush { opacity: .5; }
  /* thinking: upar dekhna */
  body.thinking .pupils { transform: translate(2px, -3px); }
  body.thinking .head { transform: rotate(-3deg); }
  /* speaking: cute, khush */
  body.speaking #blush { opacity: .6; }
  body.speaking .head { animation: nod 1.4s ease-in-out infinite; }
  @keyframes nod { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(1.8deg) translateY(1px); } }
  /* cool: kaam ke baad wink */
  body.wink #eyeR { opacity: 0; }
  body.wink #wink { opacity: 1; }
  body.wink .eyes { animation: none; }

  .avimg { display: none; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    max-height: 46vh; max-width: 30vw; object-fit: contain; transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 100%); mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
    filter: drop-shadow(0 0 18px rgba(255,59,59,.35)); animation: idlefloat 4s ease-in-out infinite; }
  body.has-avatar .avimg { display: block; }
  body.has-avatar .avatar { display: none; }
  @keyframes idlefloat { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-6px); } }
  @keyframes talk { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.025) translateY(-3px); } }
  body.speaking .avimg { animation: talk .22s ease-in-out infinite alternate; filter: drop-shadow(0 0 26px rgba(255,95,162,.6)); }
  body.listening .avimg { filter: drop-shadow(0 0 22px rgba(57,229,140,.45)); }

  /* bubble above avatar */
  .bubble { position: absolute; left: 50%; top: 62px; transform: translateX(-50%);
    max-width: min(520px, 86%); padding: 10px 14px; border-radius: 14px; background: rgba(20,10,14,.88);
    border: 1px solid rgba(255,95,162,.35); font-size: 14px; text-align: center; opacity: 0; transition: opacity .3s; }
  .bubble.show { opacity: 1; }

  /* right panel */
  .clock { font-size: 34px; font-weight: 300; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .date { color: var(--dim); font-size: 12px; margin-top: -2px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .btns button { background: rgba(255,255,255,.04); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 6px; font: inherit; font-size: 12px; cursor: pointer; transition: background .15s, border-color .15s; }
  .btns button:hover { background: rgba(255,59,59,.14); border-color: rgba(255,59,59,.5); }
  .log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .msg { padding: 7px 10px; border-radius: 10px; font-size: 12.5px; max-width: 92%; word-wrap: break-word; }
  .msg.you { align-self: flex-end; background: rgba(255,255,255,.07); }
  .msg.her { align-self: flex-start; background: rgba(255,59,59,.13); border: 1px solid rgba(255,59,59,.22); }
  .msg small { display: block; color: var(--dim); font-size: 10px; margin-bottom: 2px; }
  .log::-webkit-scrollbar { width: 5px; } .log::-webkit-scrollbar-thumb { background: #3a2226; border-radius: 3px; }

  /* bottom */
  .bottom { grid-area: bottom; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-top: 1px solid var(--line); background: #0b080a; }
  .bottom input { flex: 1; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.04);
    color: var(--text); padding: 0 12px; font: inherit; outline: none; }
  .bottom input:focus { border-color: rgba(255,59,59,.55); }
  .bottom button { height: 34px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--red2); color: #fff; font: inherit; cursor: pointer; }
  .bottom .hint { color: var(--dim); font-size: 11px; white-space: nowrap; }
  @media (max-width: 980px) { .app { grid-template-columns: 0 1fr 280px; } .left { display: none; } }
</style>
</head>
<body class="idle">
<div class="app">
  <div class="top">
    <span class="dot" id="conn"></span>
    <span><b>MIKASA</b> &nbsp;PERSONAL AI</span>

                <circle cx="95" cy="126.5" r="3.6" fill="#fff"/><circle cx="102" cy="137" r="1.7" fill="#fff" opacity=".85"/></g>

                <ellipse cx="141.5" cy="133" rx="4.2" ry="5.5" fill="#5a2608"/>
                <circle cx="138" cy="126.5" r="3.6" fill="#fff"/><circle cx="145" cy="137" r="1.7" fill="#fff" opacity=".85"/></g>

<script>
const $ = (id) => document.getElementById(id);
const STATE_TEXT = { idle: 'Ready · "Mikasa" boliye', listening: 'Sun rahi hoon...', thinking: 'Soch rahi hoon...', speaking: 'Bol rahi hoon...', sleeping: 'So rahi hoon · "Mikasa" boliye' };
const MOUTHS = ['M112 156 Q120 161 128 156', 'M111 154 Q120 168 129 154 Q120 159 111 154', 'M113 153 Q120 172 127 153 Q120 157 113 153', 'M110 155 Q120 165 130 155 Q120 160 110 155'];
const SMIRK = 'M112 157 Q122 160 130 153';
let lastState = 'idle', winkTimer = null;
let mouthTimer = null, bubbleTimer = null;

let hasAvatar = false;
function setState(s) {
  s = s || 'idle';
  const wasSpeaking = lastState === 'speaking';
  lastState = s;
  document.body.className = s + (hasAvatar ? ' has-avatar' : '');
  $('stateText').textContent = STATE_TEXT[s] || s;
  clearInterval(mouthTimer);
  if (s === 'speaking') {
    mouthTimer = setInterval(() => {
      $('mouth').setAttribute('d', MOUTHS[1 + Math.floor(Math.random() * 3)]);
      $('core').style.transform = `scale(${1 + Math.random() * 0.12})`;
    }, 110);
  } else {
    $('mouth').setAttribute('d', MOUTHS[0]);
    $('core').style.transform = 'scale(1)';
  }
  // bolna khatam -> kabhi-kabhi cool wink + smirk
  clearTimeout(winkTimer);
  if (wasSpeaking && s !== 'speaking' && Math.random() < 0.6) {
    document.body.classList.add('wink');
    $('mouth').setAttribute('d', SMIRK);
    winkTimer = setTimeout(() => { document.body.classList.remove('wink'); $('mouth').setAttribute('d', MOUTHS[0]); }, 1300);
  }
}

function addMsg(who, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + (who === 'you' ? 'you' : 'her');
  const s = document.createElement('small');
  s.textContent = who === 'you' ? '{{USER}}' : 'Mikasa';
  d.appendChild(s);
  d.appendChild(document.createTextNode(text));
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  while ($('log').children.length > 60) $('log').firstChild.remove();
}

function showBubble(text) {
  const b = $('bubble');
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove('show'), Math.min(12000, 2500 + text.length * 60));
}

function setInfo(info) {
  if (info.stt) $('i_stt').textContent = info.stt;
  if (info.ai) $('i_ai').textContent = info.ai;
  if (info.voice) $('i_voice').textContent = info.voice;
  if (info.mic !== undefined) $('hint').textContent = info.mic ? '🎤 Mic on' : '⌨️ Text mode';
}

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { $('conn').style.background = 'var(--green)'; };
  es.onerror = () => { $('conn').style.background = 'var(--red)'; };
  es.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'hello') {
      hasAvatar = !!m.avatar;
      if (hasAvatar) $('avimg').src = '/avatar?' + Date.now();
      setState(m.state); setInfo(m.info || {});
      $('log').innerHTML = '';
      (m.log || []).forEach((x) => addMsg(x.type === 'heard' ? 'you' : 'her', x.text));
    } else if (m.type === 'state') setState(m.state);
    else if (m.type === 'info') setInfo(m);
    else if (m.type === 'heard') addMsg('you', m.text);
    else if (m.type === 'reply') { addMsg('her', m.text); showBubble(m.text); }
    else if (m.type === 'reminder') { showBubble('⏰ ' + m.text); }
  };
}

function pct(id, v) { $(id).textContent = v == null ? 'n/a' : Math.round(v) + '%'; $(id + 'B').style.width = (v || 0) + '%'; }
function dur(s) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}h ${m}m` : `${m}m`; }
function kb(v) { return v == null ? '-' : v > 1024 ? (v / 1024).toFixed(1) + ' MB/s' : v + ' KB/s'; }

async function stats() {
  try {
    const s = await (await fetch('/stats')).json();
    pct('cpu', s.cpu); pct('ram', s.ram); pct('disk', s.disk);
    pct('bat', s.battery);
    if (s.battery != null) $('bat').textContent = s.battery + '%' + (s.charging ? ' ⚡' : '');
    $('ramgb').textContent = `${s.ram_gb} / ${s.ram_total} GB`;
    $('cores').textContent = s.cores;
    $('down').textContent = kb(s.down_kbps); $('up').textContent = kb(s.up_kbps);
    $('uptime').textContent = dur(s.uptime); $('muptime').textContent = dur(s.mikasa_uptime);
  } catch (e) { /* Mikasa band ho to chup */ }
}

function tick() {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  $('date').textContent = d.toLocaleDateString('hi-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

async function send(text) {
  text = (text || '').trim();
  if (!text) return;
  await fetch('/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
}
$('send').onclick = () => { send($('inp').value); $('inp').value = ''; };
$('inp').addEventListener('keydown', (e) => { if (e.key === 'Enter') { send($('inp').value); $('inp').value = ''; } });
document.querySelectorAll('.btns button').forEach((b) => b.onclick = () => send(b.dataset.cmd));

connect(); tick(); stats();
setInterval(tick, 1000); setInterval(stats, 2000);
</script>
</body>
</html>
